<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For each</title>
</head>
<body>

    <script>
        const numbers = [1,2,3];
        numbers.forEach(num => console.log(num*2));

        const numbers2 = [1,2,3];
        const square = numbers2.map(num => num * num);
        console.log(square);     //1 4 9
        console.log(numbers2);  // 1 2 3

        const numbers3 = [1,2,3,4,5,6];      
        const even = numbers3.filter(num => num % 2 == 0);
        console.log(even);  // used to select certain elements

        const numbers4 = [1,2,3,4];
        const sum = numbers4.reduce((acc,num) => acc + num,0);
        console.log(sum);  //reduce array to single value by applying fun repeatedly



    </script>
    
</body>
</html>
